<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="peelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glow effect -->
  <rect x="100" y="80" width="312" height="352" rx="32" fill="url(#neonGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Main Sticker Body with a peeled top-right corner -->
  <path d="M 100,112 C 100,94.3 114.3,80 132,80 L 320,80 L 412,172 L 412,400 C 412,417.7 397.7,432 380,432 L 132,432 C 114.3,432 100,417.7 100,400 Z" fill="url(#peelGrad)" stroke="url(#neonGrad)" stroke-width="16" stroke-linejoin="round" />

  <!-- Peeling fold (Top-Right) -->
  <path d="M 320,80 L 320,152 C 320,163 329,172 340,172 L 412,172 Z" fill="url(#neonGrad)" stroke="url(#neonGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Graphic inside the sticker: A soccer badge pattern -->
  <!-- Outer shield / badge -->
  <path d="M 180,180 L 256,150 L 332,180 L 306,310 L 256,340 L 206,310 Z" stroke="url(#neonGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Stylized crown / stripes inside the shield -->
  <path d="M 220,220 L 256,200 L 292,220 L 280,280 L 256,295 L 232,280 Z" fill="url(#neonGrad)" fill-opacity="0.2" stroke="url(#neonGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="250" r="16" fill="url(#neonGrad)" />
</svg>