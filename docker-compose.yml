services:
  db:
    image: mariadb:10.11
    container_name: panini-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: panini_db
    ports:
      - "3306:3306"
    volumes:
      - ./db/db_schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 5

