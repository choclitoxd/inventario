# Configuración base compartida — NO contiene credenciales de ningún entorno
spring:
  application:
    name: panini-inventario
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver

server:
  port: 8080
